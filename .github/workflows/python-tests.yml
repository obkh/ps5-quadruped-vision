name: Python vision tests

on:
  push:
  pull_request:

jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r vision/requirements.txt
      - run: python -m unittest discover -s tests -v
